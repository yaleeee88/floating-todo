name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches the app version
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { throw new Error('Expected tag ' + expected + ', got ' + process.env.GITHUB_REF_NAME); }"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "悬浮待办 ${{ github.ref_name }}"
          releaseBody: |
            四项轻量优化：备忘录跳过无变化的重复保存；跨窗口仅同步小型主题/内容状态；主面板复用未变化的卡片与列表；已完成历史先选择可见记录再计算和渲染。

            保持原有勾选、展开、切换动效，正常编辑仍按 220ms 间隔自动保存，失焦与关闭立即补存。所有旧记录、备份、便签文字与加粗格式兼容；没有新增前端框架依赖。仍按需创建便签窗口、关闭释放 WebView，并保留后台低内存策略。

            下载下方对应平台安装包。Windows 更新时直接运行新版安装包即可，安装器会覆盖旧版本并保留本机数据，无需提前卸载；若被 SmartScreen 拦截，点「更多信息 → 仍要运行」。macOS 首次打开若提示「已损坏」或「身份不明的开发者」，请见 README。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  rename-assets:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 规整安装包文件名（去掉中文产品名被清洗后留下的下划线前缀）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              _*) gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
                    -f name="floating-todo${name}" && echo "renamed $name -> floating-todo${name}" ;;
            esac
          done
